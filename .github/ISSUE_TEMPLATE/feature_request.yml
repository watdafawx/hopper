name: Suggest an idea
description: Something Hopper or Hopper Server could do, or do better.
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Hopper
        - Hopper Server
        - Both
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the moment it would help, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
    validations:
      required: false
