name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Library tests
        run: cargo test -p hopper-core --lib
      - name: Build the app
        run: cargo build --bin hopper
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/hopperd/ui/pnpm-lock.yaml
      - name: Build Hopper Server's web UI
        working-directory: crates/hopperd/ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Hopper Server tests
        run: cargo test -p hopperd
      - name: Build Hopper Server
        run: cargo build -p hopperd

  # Hopper Server runs on Linux too: its tests and a build there.
  hopperd-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/hopperd/ui/pnpm-lock.yaml
      - name: Build Hopper Server's web UI
        working-directory: crates/hopperd/ui
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Hopper Server tests
        run: cargo test -p hopperd
      - name: Build Hopper Server
        run: cargo build -p hopperd

  # Hopper desktop on Linux and macOS: does it compile yet? Not required
  # to pass while the ports are under way.
  desktop-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries GPUI needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libxcb1-dev             libfontconfig-dev libfreetype-dev libasound2-dev libssl-dev libzstd-dev libdbus-1-dev pkg-config clang
      - name: Rust (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check the desktop app
        run: cargo check --bin hopper --message-format short
