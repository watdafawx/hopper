<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a server · Hopper</title>
<meta name="description" content="A friend shared their Minecraft server from Hopper. Copy the address and join.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#121214">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--panel:#16161a;--panel2:#1b1b20;--line:#26262c;--fg:#ededef;--mut:#a1a1aa;--acc:#f97316;--acc2:#fb8a3c;--acc-ink:#1c0d02}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:16px/1.6 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
h1,h2,h3,.brand{font-family:Archivo,"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;word-spacing:.08em}
.card{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px}
.top img{width:48px;height:48px;image-rendering:pixelated}
h1{font-size:22px;line-height:1.25}
p{color:var(--mut);font-size:15px}
.addr{display:flex;gap:8px}
.addr code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:500 15px "IBM Plex Mono",ui-monospace,Consolas,monospace}
button,a.btn{font:600 15px "IBM Plex Sans",system-ui,"Segoe UI",sans-serif;border-radius:8px;padding:10px 16px;cursor:pointer;text-decoration:none;text-align:center}
button{background:var(--acc);color:var(--acc-ink);border:0}
button:hover{background:var(--acc2)}
a.btn{border:1px solid var(--line);color:var(--fg)}
a.btn:hover{background:var(--panel2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
ol{color:var(--mut);font-size:14px;padding-left:20px}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <img src="hopper.png" alt="">
    <div>
      <h1 id="title">Join a Minecraft server</h1>
      <p>Shared from Hopper on Discord.</p>
    </div>
  </div>
  <div id="have" hidden>
    <div class="addr"><code id="address"></code><button id="copy" type="button">Copy</button></div>
  </div>
  <p id="none" hidden>This link has no server address.</p>
  <ol>
    <li>Install the same modpack your friend plays.</li>
    <li>In Minecraft, open Multiplayer, then Direct Connection.</li>
    <li>Paste the address and join.</li>
  </ol>
  <a class="btn" href="./">Get Hopper</a>
</main>
<script>
// Values come from the link and are only ever shown as text.
var q = new URLSearchParams(location.search);
var addr = (q.get("address") || "").trim();
var name = (q.get("name") || "").trim().slice(0, 64);
if (name) {
  document.getElementById("title").textContent = "Join " + name;
  document.title = "Join " + name + " · Hopper";
}
if (/^[A-Za-z0-9.\-:]{3,255}$/.test(addr)) {
  document.getElementById("address").textContent = addr;
  document.getElementById("have").hidden = false;
  document.getElementById("copy").onclick = function () {
    var b = this;
    navigator.clipboard.writeText(addr).then(function () {
      b.textContent = "Copied";
      setTimeout(function () { b.textContent = "Copy"; }, 1500);
    });
  };
} else {
  document.getElementById("none").hidden = false;
}
</script>
</body>
</html>
