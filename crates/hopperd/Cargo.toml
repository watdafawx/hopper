[package]
name = "hopperd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hopper Server: a standalone Minecraft server panel"
# Released on its own (tags hopperd-v<version>), not with Hopper desktop.
publish = false

[dependencies]
hopper-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
crc32fast = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"
include_dir = "0.7"
mdns-sd.workspace = true
if-addrs = "0.13"

[build-dependencies]
flate2.workspace = true

[dev-dependencies]
zip.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
