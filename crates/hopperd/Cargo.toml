[package]
name = "hopperd"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Hopper Server: a standalone Minecraft server panel"
# Released on its own (tags hopperd-v<version>), not with Hopper desktop.
publish = false

[dependencies]
zip.workspace = true
hopper-core.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
regex.workspace = true
base64.workspace = true
sha1_smol.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
crc32fast = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
argon2 = "0.5"
getrandom = "0.3"
sha2 = "0.10"
# Off-site backup copies: encryption and S3 request signing (rustls already uses it).
ring = "0.17"
include_dir = "0.7"
mdns-sd.workspace = true
if-addrs = "0.13"
# TLS: our own certificates, and Let's Encrypt's (an IP, an sslip.io name or a domain).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
time = "0.3"
ureq.workspace = true
russh = { version = "0.64", default-features = false, features = ["ring"] }
russh-sftp = "3"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
# ACME with profiles and IP identifiers (Let's Encrypt's short-lived IP certificates).
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring"] }
x509-parser = "0.18"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false }
# Two-factor sign-in: the QR code to scan.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
# The first-run dialog, the tray icon, Start with Windows (the Run key).
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
flate2.workspace = true
# The exe's icon and manifest (Windows).
winresource = "0.1"

[dev-dependencies]
zip.workspace = true
http-body-util = "0.1"
