# Hopper Server with Docker Compose:
#   docker compose -f crates/hopperd/packaging/docker-compose.yml up -d
# Then open http://<this machine>:8790 and use the setup code from
#   docker compose -f crates/hopperd/packaging/docker-compose.yml logs hopperd
services:
  hopperd:
    image: ghcr.io/watdafawx/hopperd:latest
    # Or build it from this repository instead:
    # build:
    #   context: ../../..
    #   dockerfile: crates/hopperd/Dockerfile
    # The panel's name (shown in the UI and to Hopper desktop).
    hostname: hopper
    restart: unless-stopped
    # Time for the Minecraft servers to save and stop on `docker compose down`.
    stop_grace_period: 2m
    ports:
      - "8790:8790"   # panel (web UI and API)
      - "8022:8022"   # SFTP
      - "25565:25565" # server addresses: one Minecraft port for every server
      # A server joined by its own port needs it published too, e.g.:
      # - "25566:25566"
    volumes:
      # The panel folder: servers in servers/, the panel's data in .hopper-server/.
      - hopperd:/hopper
      # Or a folder on this machine: - ./hopper:/hopper
    # LAN discovery (mDNS, so Hopper desktop finds the panel) needs host
    # networking: use this instead of ports (Linux hosts only).
    # network_mode: host
volumes:
  hopperd:
