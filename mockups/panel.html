<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hopper Server Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#141418; --base:#1a1a1f; --surface:#212127; --raise:#28282f; --line:#2f2f37; --line2:#3a3a44;
  --text:#ececf1; --subtle:#a3a3ad; --muted:#6f6f7a;
  --acc:#f97316; --acc-dim:#f9731622; --green:#22c55e; --green-dim:#22c55e1f; --gold:#eab308; --gold-dim:#eab3081f;
  --blue:#60a5fa; --blue-dim:#60a5fa1f; --red:#ef4444; --red-dim:#ef44441f; --violet:#a78bfa; --violet-dim:#a78bfa1f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;padding:16px 16px 64px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
[data-lucide]{width:14px;height:14px;stroke-width:2;flex:none}
.mono{font-family:"JetBrains Mono",monospace}
.page{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:20px;font-weight:700}
.lede{color:var(--subtle);max-width:1000px}
.switch{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:#141418ee;padding:10px 0;backdrop-filter:blur(6px)}
.switch button{padding:7px 14px;border-radius:999px;border:1px solid var(--line2);color:var(--subtle);font-weight:500}
.switch button.on{background:var(--acc);border-color:var(--acc);color:#1a1a1f;font-weight:600}
.pitch{color:var(--subtle);max-width:1100px}
.pitch b{color:var(--text)}
.screen{display:none;flex-direction:column;gap:12px}
.screen.on{display:flex}

/* shared bits */
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;border:1px solid var(--line2);font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface)}
.btn:hover{background:var(--raise)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a1a1f;font-weight:600}
.btn.go{background:var(--green);border-color:var(--green);color:#0b1a10;font-weight:600}
.btn.bad{color:var(--red);border-color:#ef444455}
.btn.ghost{background:none;border-color:transparent;color:var(--subtle)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.icon{padding:5px 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--subtle);white-space:nowrap}
.chip.run{color:var(--green);border-color:#22c55e55;background:var(--green-dim)}
.chip.warn{color:var(--gold);border-color:#eab30855;background:var(--gold-dim)}
.chip.bad{color:var(--red);border-color:#ef444455;background:var(--red-dim)}
.chip.lan{color:var(--blue);border-color:#60a5fa55;background:var(--blue-dim)}
.chip.ts{color:var(--violet);border-color:#a78bfa55;background:var(--violet-dim)}
.chip.acc{color:var(--acc);border-color:#f9731655;background:var(--acc-dim)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.dot.g{background:var(--green);box-shadow:0 0 0 3px var(--green-dim)}
.dot.y{background:var(--gold)} .dot.r{background:var(--red)}
.sp{flex:1}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)} .subtle{color:var(--subtle)}
.small{font-size:12px} .tiny{font-size:11px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h3{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:10px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.input{display:flex;align-items:center;gap:7px;background:var(--base);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;color:var(--subtle)}
.input input{background:none;border:0;outline:0;flex:1;min-width:0}
.bar{height:5px;border-radius:9px;background:var(--raise);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.bar.g i{background:var(--green)} .bar.b i{background:var(--blue)}
.kbd{font:11px "JetBrains Mono",monospace;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--subtle)}
.toggle{width:28px;height:16px;border-radius:9px;background:var(--line2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;top:2px;left:2px}
.toggle.on{background:var(--acc)} .toggle.on::after{left:14px}

/* panel chrome */
.win{background:var(--base);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:820px;display:flex;box-shadow:0 30px 80px #0009}
.side{width:224px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:2px;background:#17171b}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;font-size:14px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#fb923c,#ea580c);display:grid;place-items:center;color:#1a1a1f}
.logo [data-lucide]{width:15px;height:15px;stroke-width:2.5}
.nav{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--subtle);font-weight:500}
.nav:hover{background:var(--surface)}
.nav.on{background:var(--raise);color:var(--text)}
.nav .n{margin-left:auto;font-size:11px;color:var(--muted)}
.navsec{padding:14px 9px 5px}
.srv{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--subtle)}
.srv.on{background:var(--raise);color:var(--text)}
.srv .ic{width:20px;height:20px;border-radius:5px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#1a1a1f}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding:10px 4px 0;display:flex;flex-direction:column;gap:8px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);flex:none}
.top .search{width:320px}
.conn{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;border:1px solid #60a5fa44;background:var(--blue-dim);color:var(--blue);font-size:12px;font-weight:500}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa)}
.content{flex:1;min-height:0;overflow:auto;padding:18px}
.shead{display:flex;align-items:center;gap:12px;padding:14px 18px 0;flex:none}
.shead .big{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-weight:800;color:#1a1a1f;font-size:15px}
.shead h2{font-size:17px;font-weight:700}
.tabs{display:flex;gap:20px;padding:0 18px;border-bottom:1px solid var(--line);color:var(--subtle);font-weight:500;flex:none;margin-top:12px}
.tabs span{padding:10px 0;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tabs span.on{color:var(--text);box-shadow:inset 0 -2px var(--acc)}

/* overview */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat .v{font-size:22px;font-weight:700;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
.spark{height:34px;margin-top:8px}
.servers{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:12px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:11px}
.scard:hover{border-color:var(--line2)}
.scard .hd{display:flex;align-items:center;gap:10px}
.scard .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#1a1a1f}
.scard .nm{font-weight:600}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.meter .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.meter .t b{color:var(--text);font-weight:500}
.heads{display:flex}
.heads i{width:20px;height:20px;border-radius:4px;border:2px solid var(--surface);margin-left:-5px;display:block}
.heads i:first-child{margin-left:0}

/* console */
.split{display:flex;gap:14px;height:100%}
.term{flex:1;min-width:0;background:#0f0f12;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.term .tb{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--base)}
.lines{flex:1;overflow:auto;padding:10px 12px;font:12px/1.6 "JetBrains Mono",monospace;color:#c9c9d1}
.lines div{white-space:pre-wrap;word-break:break-all}
.lines .t{color:var(--muted)} .lines .w{color:var(--gold)} .lines .e{color:var(--red)} .lines .i{color:var(--blue)} .lines .j{color:var(--green)} .lines .c{color:var(--acc)}
.cmd{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:8px 10px;background:var(--base);position:relative}
.cmd input{flex:1;background:none;border:0;outline:0;font:12.5px "JetBrains Mono",monospace}
.ac{position:absolute;bottom:44px;left:28px;width:330px;background:var(--raise);border:1px solid var(--line2);border-radius:8px;padding:4px;box-shadow:0 10px 30px #0008;font:12px "JetBrains Mono",monospace}
.ac div{padding:5px 8px;border-radius:5px;display:flex;justify-content:space-between;color:var(--subtle)}
.ac div.on{background:var(--acc-dim);color:var(--text)}
.ac span{font-family:Inter;font-size:11px;color:var(--muted)}
.rail{width:300px;flex:none;display:flex;flex-direction:column;gap:12px;overflow:auto}
.plist div{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.plist div:last-child{border:0}
.plist i{width:20px;height:20px;border-radius:4px;display:block;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv span:nth-child(odd){color:var(--muted)}

/* files */
.fwrap{display:flex;height:100%;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tree{width:200px;flex:none;border-right:1px solid var(--line);padding:8px;overflow:auto;background:#18181c;font-size:12.5px}
.tree div{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;color:var(--subtle);white-space:nowrap}
.tree div.on{background:var(--raise);color:var(--text)}
.flist{flex:1;min-width:0;display:flex;flex-direction:column}
.ftool{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0}
.fname{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.crumbs{display:flex;align-items:center;gap:4px;color:var(--subtle);font-size:12.5px;white-space:nowrap;min-width:0;overflow:hidden}
.crumbs b{color:var(--text);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--base)}
td{padding:6px 10px;border-bottom:1px solid #26262c;white-space:nowrap}
tr.sel td{background:var(--acc-dim)}
tr:hover td{background:#ffffff06}
.ficon{width:22px;height:22px;border-radius:5px;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px}
.modicon{width:22px;height:22px;border-radius:5px;display:inline-block;vertical-align:middle;margin-right:8px}
.fscroll{flex:1;overflow:auto}
.selbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface)}
.drop{position:absolute;inset:0;border:2px dashed var(--acc);border-radius:10px;background:#f973160d;display:grid;place-items:center}
.queue{width:290px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#18181c}
.queue .q{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.editor{flex:1;background:#0f0f12;font:12px/1.65 "JetBrains Mono",monospace;padding:10px 0;overflow:auto}
.editor div{padding:0 12px;white-space:pre;display:flex}
.editor .ln{color:#4a4a55;width:34px;text-align:right;margin-right:14px;flex:none}
.editor .k{color:var(--blue)} .editor .s{color:var(--green)} .editor .n{color:var(--acc)} .editor .cm{color:var(--muted)} .editor .h{color:var(--violet)}
.editor .chg{background:#22c55e14}

/* backups */
.tl{display:flex;flex-direction:column}
.tl .b{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.week{display:grid;grid-template-columns:60px repeat(7,1fr);gap:4px;font-size:11px}
.week .c{height:26px;border-radius:5px;background:var(--base);border:1px solid var(--line);display:flex;align-items:center;padding:0 6px;gap:4px;color:var(--subtle);overflow:hidden;white-space:nowrap}
.week .c.r{background:var(--acc-dim);border-color:#f9731644;color:var(--acc)}
.week .c.bk{background:var(--blue-dim);border-color:#60a5fa44;color:var(--blue)}

/* access */
.code6{display:flex;gap:8px;justify-content:center;margin:14px 0}
.code6 span{width:44px;height:54px;border-radius:9px;background:var(--base);border:1px solid var(--line2);display:grid;place-items:center;font:600 24px "JetBrains Mono",monospace}
.path{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--base)}
.path.best{border-color:#60a5fa66;background:#60a5fa0d}

/* desktop hopper */
.hwin{background:var(--base);border:1px solid var(--line);border-radius:10px;overflow:hidden;height:820px;display:flex;flex-direction:column;box-shadow:0 30px 80px #0009}
.htitle{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#17171b}
.hero{display:flex;align-items:center;gap:14px;padding:16px 20px}
.hero .art{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#365314,#84cc16)}
.diffrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px}
.tag.add{background:var(--green-dim);color:var(--green)} .tag.upd{background:var(--blue-dim);color:var(--blue)} .tag.del{background:var(--red-dim);color:var(--red)} .tag.skip{background:var(--raise);color:var(--muted)}

/* phone */
.phones{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;padding:10px 0}
.phone{width:340px;height:720px;border-radius:40px;border:10px solid #2a2a31;background:var(--base);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px #0009;position:relative}
.phone .st{display:flex;justify-content:space-between;padding:10px 22px 6px;font-size:12px;font-weight:600}
.phone .ph{padding:6px 16px 10px;display:flex;align-items:center;gap:10px}
.phone .pb{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.phone .bn{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:9px 0 16px;color:var(--muted);font-size:10.5px}
.phone .bn div{display:flex;flex-direction:column;align-items:center;gap:3px}
.phone .bn div.on{color:var(--acc)}
.pw{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pw .btn{justify-content:center;padding:9px}

@media (max-width:900px){.side{display:none}.rail,.queue,.tree{display:none}.grid4{grid-template-columns:1fr 1fr}.top .search{display:none}}
</style>
</head>
<body>
<div class="page">
  <h1>Hopper Server: panel mockups</h1>
  <p class="lede">Standalone panel (<span class="mono">hopperd</span>) served from the server machine, same dark look as Hopper. Every screen here is also reachable from Hopper desktop through the same API. Spec: <span class="mono">design/server-panel.md</span>.</p>
  <div class="switch" id="switch"></div>
  <div id="screens"></div>
</div>

<template id="chrome">
  <div class="win">
    <aside class="side">
      <div class="brand"><div class="logo"><i data-lucide="server"></i></div>Hopper Server<span class="chip tiny" style="margin-left:auto">rig</span></div>
      <div class="nav" data-n="overview"><i data-lucide="layout-dashboard"></i>Overview</div>
      <div class="nav" data-n="files-all"><i data-lucide="folder-tree"></i>Files<span class="n">all servers</span></div>
      <div class="nav" data-n="backups-all"><i data-lucide="archive"></i>Backups</div>
      <div class="nav" data-n="activity"><i data-lucide="activity"></i>Activity</div>
      <div class="navsec lbl">Servers</div>
      <div class="srv" data-s="tnp"><div class="ic" style="background:#84cc16">T</div>TNP Limitless 8<span class="dot g" style="margin-left:auto"></span></div>
      <div class="srv" data-s="atm"><div class="ic" style="background:#60a5fa">A</div>ATM 10<span class="dot g" style="margin-left:auto"></span></div>
      <div class="srv" data-s="cc"><div class="ic" style="background:#f472b6">C</div>Create Chill<span class="dot y" style="margin-left:auto"></span></div>
      <div class="srv" data-s="van"><div class="ic" style="background:#a3a3ad">V</div>Vanilla 1.21.4<span class="dot" style="margin-left:auto"></span></div>
      <div class="nav" style="margin-top:4px"><i data-lucide="plus"></i>New server</div>
      <div class="foot">
        <div class="nav" data-n="access"><i data-lucide="shield"></i>Access &amp; network</div>
        <div class="nav"><i data-lucide="settings"></i>Settings</div>
        <div class="row tiny muted" style="padding:0 8px">hopperd 0.1.0 · up 12 d</div>
      </div>
    </aside>
    <div class="main">
      <div class="top">
        <div class="input search"><i data-lucide="search"></i><input placeholder="Search servers, files, players, commands…"><span class="kbd">Ctrl K</span></div>
        <div class="sp"></div>
        <div class="conn"><i data-lucide="wifi"></i>LAN · 192.168.50.3 · 1 ms</div>
        <button class="btn icon ghost"><i data-lucide="bell"></i></button>
        <div class="avatar"></div>
      </div>
      <div class="slot" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
    </div>
  </div>
</template>

<script>
const S = {
  overview:{label:"Overview", pitch:"<b>Host at a glance.</b> Every server with live state, players, CPU, RAM and TPS pushed over one WebSocket (no polling). Host stats on top. Connection badge always says which path is live."},
  console:{label:"Console", pitch:"<b>Console first.</b> ANSI colours, filter chips (errors, joins, chat), command autocomplete from the server's own command tree, history with ↑. Right rail: power, players, live stats, quick info."},
  files:{label:"Files", pitch:"<b>File manager is the headline.</b> Tree + virtualized list, mod-aware columns in <span class='mono'>mods/</span> (icon, version, side, updates), multi-select bulk actions, drag-drop folder upload. Transfer queue shows speed and which path it uses — here it moved itself onto LAN."},
  editor:{label:"Editor", pitch:"<b>Config editing.</b> Syntax for TOML/JSON/properties/SNBT/KubeJS, validates before save, every save keeps the old version. Diff against last version, a backup, or the Hopper instance's copy."},
  backups:{label:"Backups & schedules", pitch:"<b>Backups and automation.</b> Incremental, deduplicated, with retention. Off-site targets. Restore whole or a single file. Week view of scheduled restarts, backups and tasks."},
  settings:{label:"Server settings", pitch:"<b>Server configuration.</b> server.properties as a form with descriptions, JVM memory slider + flag presets, Java runtime picker with auto-download, startup preview."},
  access:{label:"Access & network", pitch:"<b>LAN first, internet ready.</b> Pair Hopper with a 6-digit code + cert fingerprint. Every path the panel answers on, ranked; clients race them and keep the fastest. Users, scoped tokens, audit."},
  hopper:{label:"In Hopper desktop", pitch:"<b>Same control from Hopper.</b> Library → Server tab on a paired Hopper Server: state, console, players, and pack → server sync over the API (no more Q: drive). Client-only mods skipped automatically."},
  phone:{label:"Phone", pitch:"<b>Installable PWA.</b> Same panel on a phone: power buttons, console, players, push notifications for crashes."},
};
const order = Object.keys(S);
const sw = document.getElementById('switch'), box = document.getElementById('screens');

function chrome(nav, srv, inner){
  const t = document.getElementById('chrome').content.cloneNode(true);
  if(nav) t.querySelector(`[data-n="${nav}"]`)?.classList.add('on');
  if(srv) t.querySelector(`[data-s="${srv}"]`)?.classList.add('on');
  t.querySelector('.slot').innerHTML = inner;
  const d = document.createElement('div'); d.appendChild(t); return d.innerHTML;
}
function shead(tab){
  const tabs = ["Console","Files","Players","Backups","Schedules","Mods","Settings","Logs"];
  return `<div class="shead"><div class="big" style="background:#84cc16">T</div>
    <div><div class="row"><h2>TNP Limitless 8</h2><span class="chip run"><span class="dot g"></span>Running · 3 h 12 m</span></div>
    <div class="small muted">NeoForge 21.1.172 · Minecraft 1.21.1 · :25565 · paired with Hopper instance <span class="subtle">TNP Limitless 8</span></div></div>
    <div class="sp"></div>
